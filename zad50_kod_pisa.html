    <title>Suma szeregu</title>
</head>
<body>

    <div id="wynik" style="color:red; font-size:50px;">
        <script>
            let suma_pis = 0;

            for (let i_p = 1; i_p <= 1000000; i_p++) {
                suma_pis = suma_pis + 1 / i_p;
            }
            document.write("suma = " + suma_pis.toFixed(2) + "<br>");
        </script>
    </div>
