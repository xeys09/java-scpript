<!DOCTYPE html>
<html>
<head>
    <title>Sprawdzenie danych Twoje nazwisko</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red; font-size:50px;">
        <script language="JavaScript">
            var liczba1, h, a, Pole;

            // Pętla pobierająca wysokość (musi być większa od 0)
            do {
                liczba1 = prompt("wysokość=", "");
                h = parseFloat(liczba1);
            } while (h <= 0 || isNaN(h));

            // Pętla pobierająca podstawę (musi być większa od 0)
            do {
                liczba1 = prompt("podstawę=", "");
                a = parseFloat(liczba1);
            } while (a <= 0 || isNaN(a));

            // Obliczenie pola trójkąta
            Pole = a * h / 2;

            // Wyświetlenie wyniku
            document.write("Pole=" + Pole.toFixed(2) + " cm^2" + "<br>");
        </script>
    </div>
</body>
</html>
